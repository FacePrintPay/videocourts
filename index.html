<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoCourts — Virtual Court System</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a26;
      --panel-2: #182232;
      --border: #253147;
      --text: #eef2f7;
      --muted: #9aa7bd;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      padding: 1.25rem 1.5rem;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
    }
    .badge {
      font-size: 0.8rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }
    .sub {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    main {
      padding: 1.5rem;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1.4fr repeat(4, minmax(130px, 1fr));
      gap: 0.65rem;
      margin-bottom: 1rem;
    }
    input, select, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0.6rem 0.8rem;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.secondary {
      background: var(--panel-2);
      border-color: var(--border);
      color: var(--text);
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .stats strong { color: var(--text); }
    .detail-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: none;
    }
    .detail-box.active { display: block; }
    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 0.85rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .card:hover { border-color: var(--accent); }
    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .card-title { margin: 0 0 0.35rem; font-size: 1rem; }
    .card-desc { margin: 0; font-size: 0.88rem; color: var(--muted); }
    .status-ok { color: var(--ok); }
    .status-warn { color: var(--warn); }
    @media (max-width: 900px) {
      .toolbar { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <h1>VideoCourts Virtual Court System</h1>
        <span class="badge" id="syncBadge">Catalog Ready</span>
      </div>
      <p class="sub">Virtual courtroom rooms, dockets, evidence logs, and indexed VideoCourts features.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="Search features, IDs, hearings, filings..." aria-label="Search features" />
      <select id="categorySelect" aria-label="Filter by category">
        <option value="all">All Categories</option>
      </select>
      <select id="sortSelect" aria-label="Sort features">
        <option value="id-asc">Sort: ID (A-Z)</option>
        <option value="name-asc">Sort: Name (A-Z)</option>
        <option value="category-asc">Sort: Category (A-Z)</option>
      </select>
      <button type="button" class="secondary" id="exportBtn">Export JSON</button>
      <button type="button" class="secondary" id="resetBtn">Reset</button>
    </div>

    <div class="stats">
      <span>Total Features: <strong id="totalCount">0</strong></span>
      <span>Filtered: <strong id="shownCount">0</strong></span>
      <span>Selected: <strong id="selectedCount">0</strong></span>
      <span>Source: <strong id="sourceLabel">Core VideoCourts Index</strong></span>
    </div>

    <section class="detail-box" id="detailPanel" aria-live="polite">
      <div class="card-top">
        <span id="detailId"></span>
        <span id="detailCategory"></span>
      </div>
      <h2 class="card-title" id="detailTitle"></h2>
      <p class="card-desc" id="detailSummary"></p>
      <div class="detail-actions">
        <button type="button" id="toggleSelectBtn">Bookmark Feature</button>
        <button type="button" class="secondary" id="copyFeatureBtn">Copy Feature JSON</button>
        <button type="button" class="secondary" id="closeDetailBtn">Close</button>
      </div>
    </section>

    <div class="grid" id="featureGrid"></div>
  </main>

  <script>
    const VIDEO_COURTS_CORE = [
      { id: "VC-001", name: "Virtual Hearing Room", category: "Courtroom", summary: "Multi-party audio/video courtroom session with judge moderation, participant admission, and mute controls." },
      { id: "VC-002", name: "Docket & Calendar Queue", category: "Docket", summary: "Case docket ordering, hearing time slots, party check-in state, and adjournment tracking." },
      { id: "VC-003", name: "Digital Evidence Presentation", category: "Evidence", summary: "Exhibit numbering, document previewing, screen sharing, and admission status notes." },
      { id: "VC-004", name: "Official Hearing Record", category: "Records", summary: "Timestamped courtroom event log, speaker markers, and session transcript index." },
      { id: "VC-005", name: "Role-Based Courtroom Access", category: "Access", summary: "Dedicated workflows for judges, clerks, counsel, litigants, witnesses, and interpreters." },
      { id: "VC-006", name: "Feature Catalog Loader", category: "Catalog", summary: "Loads thread-state.json or THREAD_SYNC.md automatically when present in the repository." }
    ];

    const state = {
      features: [...VIDEO_COURTS_CORE],
      filtered: [...VIDEO_COURTS_CORE],
      selectedIds: new Set(),
      activeId: null,
      source: "Core VideoCourts Index"
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalizeEntry(entry, index) {
      const pad = String(index + 1).padStart(4, "0");
      if (typeof entry === "string") {
        return { id: `VC-${pad}`, name: entry, category: "Catalog", summary: "VideoCourts indexed feature." };
      }
      return {
        id: entry.id || entry.code || `VC-${pad}`,
        name: entry.name || entry.title || entry.feature || `Feature ${index + 1}`,
        category: entry.category || entry.group || entry.module || "Catalog",
        summary: entry.summary || entry.description || entry.desc || "VideoCourts platform capability."
      };
    }

    function parseMarkdownCatalog(markdown) {
      const results = [];
      for (const line of markdown.split(/\r?\n/)) {
        const bulletMatch = line.match(/^\s*[-*]\s+(?:\*\*)?([^:*]+)(?:\*\*)?:\s*(.+)$/);
        if (bulletMatch) {
          results.push({
            id: `SYNC-${String(results.length + 1).padStart(4, "0")}`,
            name: bulletMatch[1].trim(),
            category: "THREAD_SYNC",
            summary: bulletMatch[2].trim()
          });
        }
      }
      return results;
    }

    async function loadExternalCatalog() {
      try {
        const jsonRes = await fetch("./thread-state.json", { cache: "no-store" });
        if (jsonRes.ok) {
          const payload = await jsonRes.json();
          const rawList = Array.isArray(payload)
            ? payload
            : Array.isArray(payload.features)
              ? payload.features
              : Array.isArray(payload.items)
                ? payload.items
                : null;
          if (rawList && rawList.length) {
            state.features = rawList.map(normalizeEntry);
            state.source = "thread-state.json";
            return;
          }
        }
      } catch (_) {}

      try {
        const mdRes = await fetch("./THREAD_SYNC.md", { cache: "no-store" });
        if (mdRes.ok) {
          const parsed = parseMarkdownCatalog(await mdRes.text());
          if (parsed.length) {
            state.features = parsed;
            state.source = "THREAD_SYNC.md";
          }
        }
      } catch (_) {}
    }

    function populateCategories() {
      const select = document.getElementById("categorySelect");
      const previous = select.value;
      const categories = ["all", ...new Set(state.features.map((f) => f.category || "Catalog"))];
      select.innerHTML = categories
        .map((cat) => `<option value="${escapeHtml(cat)}">${cat === "all" ? "All Categories" : escapeHtml(cat)}</option>`)
        .join("");
      if (categories.includes(previous)) select.value = previous;
    }

    function sortFeatures(list, sortMode) {
      const copy = [...list];
      if (sortMode === "name-asc") {
        copy.sort((a, b) => a.name.localeCompare(b.name));
      } else if (sortMode === "category-asc") {
        copy.sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
      } else {
        copy.sort((a, b) => a.id.localeCompare(b.id));
      }
      return copy;
    }

    function updateStats() {
      document.getElementById("totalCount").textContent = String(state.features.length);
      document.getElementById("shownCount").textContent = String(state.filtered.length);
      document.getElementById("selectedCount").textContent = String(state.selectedIds.size);
      const sourceEl = document.getElementById("sourceLabel");
      sourceEl.innerHTML = `<span class="status-ok">${escapeHtml(state.source)}</span>`;
      document.getElementById("syncBadge").textContent = `${state.features.length} Features`;
    }

    function renderGrid() {
      const grid = document.getElementById("featureGrid");
      if (!state.filtered.length) {
        grid.innerHTML = `<div class="card"><p class="card-desc">No features match the current search or category filter.</p></div>`;
        updateStats();
        return;
      }
      grid.innerHTML = state.filtered
        .map((item) => {
          const bookmarked = state.selectedIds.has(item.id) ? " ★" : "";
          return `
            <article class="card" data-id="${escapeHtml(item.id)}" tabindex="0">
              <div class="card-top">
                <span>${escapeHtml(item.id)}${bookmarked}</span>
                <span>${escapeHtml(item.category)}</span>
              </div>
              <h2 class="card-title">${escapeHtml(item.name)}</h2>
              <p class="card-desc">${escapeHtml(item.summary)}</p>
            </article>`;
        })
        .join("");
      updateStats();
    }

    function applyFilters() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const category = document.getElementById("categorySelect").value;
      const sortMode = document.getElementById("sortSelect").value;

      const matched = state.features.filter((item) => {
        const categoryMatch = category === "all" || item.category === category;
        const text = `${item.id} ${item.name} ${item.category} ${item.summary}`.toLowerCase();
        return categoryMatch && (!query || text.includes(query));
      });

      state.filtered = sortFeatures(matched, sortMode);
      renderGrid();
    }

    function openDetail(id) {
      const item = state.features.find((f) => f.id === id);
      if (!item) return;
      state.activeId = item.id;
      document.getElementById("detailId").textContent = item.id;
      document.getElementById("detailCategory").textContent = item.category;
      document.getElementById("detailTitle").textContent = item.name;
      document.getElementById("detailSummary").textContent = item.summary;
      document.getElementById("toggleSelectBtn").textContent = state.selectedIds.has(item.id)
        ? "Remove Bookmark"
        : "Bookmark Feature";
      document.getElementById("detailPanel").classList.add("active");
    }

    function closeDetail() {
      state.activeId = null;
      document.getElementById("detailPanel").classList.remove("active");
    }

    function toggleBookmarkActive() {
      if (!state.activeId) return;
      if (state.selectedIds.has(state.activeId)) {
        state.selectedIds.delete(state.activeId);
      } else {
        state.selectedIds.add(state.activeId);
      }
      openDetail(state.activeId);
      renderGrid();
    }

    async function copyActiveFeatureJson() {
      const item = state.features.find((f) => f.id === state.activeId);
      if (!item || !navigator.clipboard) return;
      try {
        await navigator.clipboard.writeText(JSON.stringify(item, null, 2));
      } catch (_) {}
    }

    function exportFilteredJson() {
      const blob = new Blob([JSON.stringify(state.filtered, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "videocourts-features.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    function resetFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("categorySelect").value = "all";
      document.getElementById("sortSelect").value = "id-asc";
      closeDetail();
      applyFilters();
    }

    function bindEvents() {
      document.getElementById("searchInput").addEventListener("input", applyFilters);
      document.getElementById("categorySelect").addEventListener("change", applyFilters);
      document.getElementById("sortSelect").addEventListener("change", applyFilters);
      document.getElementById("exportBtn").addEventListener("click", exportFilteredJson);
      document.getElementById("resetBtn").addEventListener("click", resetFilters);
      document.getElementById("toggleSelectBtn").addEventListener("click", toggleBookmarkActive);
      document.getElementById("copyFeatureBtn").addEventListener("click", copyActiveFeatureJson);
      document.getElementById("closeDetailBtn").addEventListener("click", closeDetail);

      const grid = document.getElementById("featureGrid");
      grid.addEventListener("click", (event) => {
        const card = event.target.closest(".card[data-id]");
        if (card) openDetail(card.dataset.id);
      });
      grid.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          const card = event.target.closest(".card[data-id]");
          if (card) {
            event.preventDefault();
            openDetail(card.dataset.id);
          }
        }
      });
    }

    (async function initApp() {
      bindEvents();
      await loadExternalCatalog();
      populateCategories();
      applyFilters();
    })();
  </script>
</body>
</html>
